workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up Firebase config
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist 2>/dev/null || echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist placed from environment variable."
          elif [ ! -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "No GoogleService-Info.plist provided in environment; generating fallback for Xcode compilation..."
            cat << 'EOF' > ios/Runner/GoogleService-Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>API_KEY</key>
	<string>AIzaSyDummyKeyForBuildOnly123456789</string>
	<key>GCM_SENDER_ID</key>
	<string>123456789012</string>
	<key>PLIST_VERSION</key>
	<string>1</string>
	<key>BUNDLE_ID</key>
	<string>com.my.dupay.app.new</string>
	<key>PROJECT_ID</key>
	<string>dupay-app</string>
	<key>STORAGE_BUCKET</key>
	<string>dupay-app.appspot.com</string>
	<key>IS_ADS_ENABLED</key>
	<false/>
	<key>IS_ANALYTICS_ENABLED</key>
	<false/>
	<key>IS_APPINVITE_ENABLED</key>
	<true/>
	<key>IS_GCM_ENABLED</key>
	<true/>
	<key>IS_SIGNIN_ENABLED</key>
	<true/>
	<key>GOOGLE_APP_ID</key>
	<string>1:123456789012:ios:abcdef1234567890</string>
</dict>
</plist>
EOF
            echo "Fallback GoogleService-Info.plist generated successfully."
          fi
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Generate iOS build config & CocoaPods
        script: |
          flutter build ios --config-only --release
          cd ios && pod install --repo-update
      - name: Set up code signing settings on Xcode project
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -n "$CM_CERTIFICATE" ]; then
            xcode-project use-profiles
          else
            echo "Skipping profile setup: credentials not yet provided in Codemagic."
          fi
      - name: Build iOS
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -n "$CM_CERTIFICATE" ]; then
            flutter build ipa --release
          else
            echo "Building unsigned iOS app (no-codesign)..."
            flutter build ipa --release --no-codesign
          fi
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/archive/*.xcarchive
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: mobile
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up Firebase config
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json placed from environment variable."
          elif [ ! -f "android/app/google-services.json" ]; then
            echo "No google-services.json provided in environment; generating fallback for Gradle compilation..."
            cat << 'EOF' > android/app/google-services.json
{
  "project_info": {
    "project_number": "123456789012",
    "project_id": "dupay-app",
    "storage_bucket": "dupay-app.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
        "android_client_info": {
          "package_name": "com.my.dupay.app.new"
        }
      },
      "api_key": [
        {
          "current_key": "AIzaSyDummyKeyForBuildOnly123456789"
        }
      ]
    }
  ],
  "configuration_version": "1"
}
EOF
            echo "Fallback google-services.json generated successfully."
          fi
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android App Bundle and APK
        script: |
          flutter build appbundle --release
          flutter build apk --release
    artifacts:
      - mobile/build/app/outputs/**/*.aab
      - mobile/build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
