workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up Firebase config
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist 2>/dev/null || echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist placed from environment variable."
          elif [ ! -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "Generating fallback GoogleService-Info.plist for Xcode compilation..."
            echo "" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Fallback GoogleService-Info.plist generated successfully."
          fi
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Generate iOS build config & CocoaPods
        script: |
          flutter build ios --config-only --release
          cd ios && pod install --repo-update
      - name: Set up code signing settings on Xcode project
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -n "$CM_CERTIFICATE" ]; then
            xcode-project use-profiles
          else
            echo "Skipping profile setup: credentials not yet provided in Codemagic."
          fi
      - name: Build iOS
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -n "$CM_CERTIFICATE" ]; then
            flutter build ipa --release
          else
            echo "Building unsigned iOS app (no-codesign)..."
            flutter build ipa --release --no-codesign
          fi
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/archive/*.xcarchive
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: mobile
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up Firebase config
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json placed from environment variable."
          elif [ ! -f "android/app/google-services.json" ]; then
            echo "Generating fallback google-services.json for Android build..."
            echo "" | base64 --decode > android/app/google-services.json
            echo "Fallback google-services.json generated successfully."
          fi
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android App Bundle and APK
        script: |
          flutter build appbundle --release
          flutter build apk --release
    artifacts:
      - mobile/build/app/outputs/**/*.aab
      - mobile/build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
